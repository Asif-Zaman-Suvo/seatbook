services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatbook
      POSTGRES_PASSWORD: seatbook
      POSTGRES_DB: seatbook
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbook"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://seatbook:seatbook@db:5432/seatbook
      PORT: 4000
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-}
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 15
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - api-config:/app/.data

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./client/src:/app/src

volumes:
  db-data:
  api-config:
