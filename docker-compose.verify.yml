# Use with the base file and an explicit disposable project name. Requires
# Compose 2.24.4+ for !override. Never operates on the application's volumes.
# docker compose -p seatbook-phase5-verify -f docker-compose.yml -f docker-compose.verify.yml up --build --wait
name: seatbook-phase5-verify
services:
  db:
    environment:
      POSTGRES_USER: seatbook_phase5
      POSTGRES_PASSWORD: seatbook_phase5
      POSTGRES_DB: seatbook_phase5
    ports: !override
      - "127.0.0.1:15435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbook_phase5 -d seatbook_phase5"]
  server:
    environment:
      DATABASE_URL: postgresql://seatbook_phase5:seatbook_phase5@db:5432/seatbook_phase5
      CLIENT_ORIGIN: http://localhost:15173
      JWT_SECRET: ""
    ports: !override
      - "127.0.0.1:14000:4000"
    volumes: !override
      - api-config:/app/.data
  client:
    environment:
      VITE_API_URL: http://localhost:14000
    ports: !override
      - "127.0.0.1:15173:5173"
    volumes: !override []
